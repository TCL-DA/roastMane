# Disable all JNDI integration in Log4j2.
# This app runs with --limit-modules and does not include java.naming,
# so we explicitly keep JNDI disabled to avoid startup warnings.
log4j2.enableJndi=false
log4j2.enableJndiLookup=false
log4j2.enableJndiJms=false
log4j2.enableJndiContextSelector=false
log4j2.enableJndiJdbc=false

# Use LMAX Disruptor-based all-async loggers for maximum throughput.
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector

# Increase the async ring buffer size (must be a power of 2; default is 256K).
log4j2.asyncLoggerRingBufferSize=262144

